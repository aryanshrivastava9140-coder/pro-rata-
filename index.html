<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, dpr;

function resize() {
    dpr = window.devicePixelRatio || 1;

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resize();
window.addEventListener("resize", resize);


// -----------------------------
// HEART SETTINGS
// -----------------------------

const message = "I love you";

let points = [];

// This is the SAME mathematical
// heart formula used in your screenshot.

for (let scale = 11; scale < 17; scale += 0.18) {

    for (let i = 0; i < 120; i++) {

        const angle = i * (Math.PI * 2) / 120;

        const x =
            16 * Math.pow(Math.sin(angle), 3);

        const y =
            13 * Math.cos(angle)
            - 5 * Math.cos(2 * angle)
            - 2 * Math.cos(3 * angle)
            - Math.cos(4 * angle);

        points.push({
            x: x * scale,
            y: -y * scale
        });
    }
}


// -----------------------------
// DRAWING
// -----------------------------

let current = 0;

function draw() {

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, W, H);

    const centerX = W / 2;
    const centerY = H / 2;

    // Keep the heart proportional
    // and make it fit nicely on phone.

    const size = Math.min(W, H);

    const multiplier = size / 620;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // Small text like the original
    const fontSize = Math.max(6, size / 72);

    ctx.font = `bold ${fontSize}px Arial`;

    for (let i = 0; i < current; i++) {

        const p = points[i];

        const x = centerX + p.x * multiplier;
        const y = centerY + p.y * multiplier;

        // Slight variation gives the
        // soft pink appearance of the screenshot.

        const pink = 175 + Math.floor(Math.random() * 35);

        ctx.fillStyle = `rgb(255, ${pink}, ${pink + 10})`;

        ctx.fillText(message, x, y);
    }

    if (current < points.length) {

        // Controls formation speed.
        // 3 = slower
        // 8 = faster

        current += 5;

        requestAnimationFrame(draw);

    } else {

        // Keep the finished heart on screen.
        requestAnimationFrame(draw);
    }
}

draw();

</script>

</body>
</html>
